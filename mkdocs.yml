site_name: LabWiki
site_description: Documentation for the SHU SIT Lab DGX Spark / Slurm cluster
site_url: https://SHU-SIT-Lab.github.io/LabWiki/
repo_url: https://github.com/SHU-SIT-Lab/LabWiki
repo_name: SHU-SIT-Lab/LabWiki
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/server
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

copyright: SHU SIT Lab - Research Computing

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - LLM Smoke Test: llm-smoke-test.md
  - Submitting Slurm Jobs: slurm-jobs.md
  - Containers (Enroot & Pyxis): containers.md
  - FAQ & Troubleshooting: faq.md
  - Contributing to These Docs: contributing.md

site_name: LabWiki
site_description: Documentation for SHU SIT Lab research computing and robots
site_url: https://SHU-SIT-Lab.github.io/LabWiki/
repo_url: https://github.com/SHU-SIT-Lab/LabWiki
repo_name: SHU-SIT-Lab/LabWiki
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/server
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

copyright: SHU SIT Lab - Research Computing

nav:
  - Home: index.md
  - Robots:
      - Overview & Safety: robots/index.md
      - Care-O-bot 4: robots/care-o-bot-4.md
      - Unitree Go2 EDU: robots/go2-edu.md
  - Getting Started: getting-started.md
  - Cluster Changes for Users: cluster-updates.md
  - LLM Smoke Test: llm-smoke-test.md
  - Submitting Slurm Jobs: slurm-jobs.md
  - Job History: job-history.md
  - Containers (Enroot & Pyxis): containers.md
  - FAQ & Troubleshooting: faq.md
  - Contributing to These Docs: contributing.md
